<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewspanort" content="width=device-width, initial-scale=1.0">
    <title>Personal Library</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>My Library</h1>
    <button class="add">New Book</button>
    <dialog>
        <button class="close">X</button>
        <form>
            <div>
                <label for="title">Title</label>
                <input type="text" id="title" name="title" required>
            </div>
            <div>
                <label for="author">Author</label>
                <input type="text" id="author" name="author" required>
            </div>
            <div>
                <label for="num">Number of Pages</label>
                <input type="number" id="num" name="numofpages" min="1" required>
            </div>
            <div>
                <span>Read?</span>
                <div class="yes">
                    <input type="radio" id="yes" name="read" value="Read" required>
                    <label for="yes">Yes</label>
                </div>
                <div class="no">
                    <input type="radio" id="no" name="read" value="Not read" required>
                    <label for="no">No</label>
                </div>
            </div>
            <div class="sub_btn">
                <button type="submit">Add Book</button>
            </div>
        </form>
    </dialog>
    <div class="container">
        <article class="card">
            <div class="title">
                <h2>Crime & punishment</h2>
            </div>
            <div class="author">
                <h2>By</h2>
                <span>Fyodor Dostoevsky</span>
            </div>
            <div class="pages">
                <h2>Number of pages : </h2>
                <span>750</span>
            </div>
            <div class="status">
                <h2>Status :</h2>
                <span class="st">Read</span>
            </div>
            <div class="button">
                <button class="toggle">Toggle</button>
            </div>
            <div class="button">
                <button class="remove">Remove</button>
            </div>
        </article>
        <article class="card">
            <div class="title">
                <h2>The Castle</h2>
            </div>
            <div class="author">
                <h2>By</h2>
                <span>Franz Kafka</span>
            </div>
            <div class="pages">
                <h2>Number of pages : </h2>
                <span>600</span>
            </div>
            <div class="status">
                <h2>Status :</h2>
                <span class="st">Read</span>
            </div>
            <div class="button">
                <button class="toggle">Toggle</button>
            </div>
            <div class="button">
                <button class="remove">Remove</button>
            </div>
        </article>
    </div>
</body>
</html>
