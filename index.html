<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewspanort" content="width=device-width, initial-scale=1.0">
    <title>Personal Library</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>My Library</h1>
    <button class="add">Add</button>
    <div class="container">
        <article class="card">
            <div class="title">
                <h2>Merchant of Venice</h2>
            </div>
            <div class="author">
                <h2>By</h2>
                <span>William Shakespear</span>
            </div>
            <div class="pages">
                <h2>Number of pages : </h2>
                <span>240</span>
            </div>
            <div class="status">
                <h2>Status :</h2>
                <span>Not read</span>
            </div>
            <div class="button">
                <button>Toggle</button>
            </div>
            <div class="button">
                <button>Remove</button>
            </div>
        </article>
        <article class="card">
            <div class="title">
                <h2>The Tempest</h2>
            </div>
            <div class="author">
                <h2>By</h2>
                <span>William Shakespear</span>
            </div>
            <div class="pages">
                <h2>Number of pages : </h2>
                <span>240</span>
            </div>
            <div class="status">
                <h2>Status :</h2>
                <span>Not read</span>
            </div>
            <div class="button">
                <button>Toggle</button>
            </div>
            <div class="button">
                <button>Remove</button>
            </div>
        </article>
    </div>
</body>
</html>
